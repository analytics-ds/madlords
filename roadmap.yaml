# Roadmap editoriale SEO evergreen — MADLORDS Magazine
#
# Cadence : 1 article SEO / semaine (lundi), du 08/06/2026 au 31/08/2026
# Horizon initial : 13 semaines (juin a aout 2026)
# Cumul avec les articles GEO (geo-comparatif) = 2 a 3 publications/semaine,
# cap reseau a 4/semaine respecte.
#
# Repartition par categorie (objectif equilibre) :
#   Bague               : 2 articles
#   Collier             : 2 articles
#   Boucle d'oreille    : 2 articles
#   Bracelet            : 2 articles
#   Bijoux (transverses): 3 articles
#   Seconde main        : 2 articles
#   Total               : 13 articles
#
# Mix d'intention :
#   Informationnel : 8 articles (62%) - guides, signification, conseils, tendances
#   Transactionnel : 5 articles (38%) - top marques, comparatifs, ou acheter
#
# Saisonnalite integree :
#   Juin (semaines 1-4)  : pic mariage + fete des peres -> bague mariage,
#                          cadeau temoin, collier mariee, BO invitee
#   Juillet (sem 5-8)    : ete + voyage + layering -> jonc signification,
#                          superposition, creoles, vendre or
#   Aout (sem 9-13)      : rentree + anticipation Noel Q4 -> cocktail,
#                          sautoir, materiaux, vintage authentique, manchette
#
# Notes :
# - Les volumes et KD ci-dessous sont des estimations indicatives,
#   a valider via Haloscan ou SEObserver avant lancement.
# - La skill /create-article-seo n'est pas encore installee sur ce blog.
#   En attendant, les KW peuvent etre rediges manuellement via /sem-redaction-from-brief
#   ou /sem-redaction-madlords (qui integre la charte editoriale Mad Lords).
# - Verifier l'absence de cannibalisation avec les articles existants
#   listes dans MEMORY.md et content/fr/blog/.


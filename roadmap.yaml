# Roadmap editoriale SEO evergreen — MADLORDS Magazine
#
# Cadence : 1 article SEO / semaine (lundi), du 08/06/2026 au 31/08/2026
# Horizon initial : 13 semaines (juin a aout 2026)
# Cumul avec les articles GEO (geo-comparatif) = 2 a 3 publications/semaine,
# cap reseau a 4/semaine respecte.
#
# Volumes verifies via Haloscan (France) le 01/06/2026.
# Tous les KW retenus ont un volume mesurable ≥ 150/mois (sauf exceptions
# marquees, choisies pour leur intent commercial fort ou leur saisonnalite).
#
# Repartition par categorie (objectif equilibre) :
#   Bague               : 2 articles
#   Collier             : 2 articles
#   Boucle d'oreille    : 2 articles
#   Bracelet            : 2 articles
#   Bijoux (transverses): 3 articles
#   Seconde main        : 2 articles
#   Total               : 13 articles
#
# Mix d'intention :
#   Informationnel dominant : 8 articles (62%)
#   Transactionnel dominant : 5 articles (38%)
#
# Saisonnalite integree :
#   Juin (semaines 1-4) : pic mariage -> bague de mariage, bijoux mariage,
#                         collier de mariage, BO mariage
#   Juillet (sem 5-8)   : ete + decouverte univers luxe -> bracelet jonc,
#                         bijoux luxe, creoles, bijou vintage
#   Aout (sem 9-13)     : rentree + anticipation Noel Q4 -> bague cocktail,
#                         sautoir or, carat or, bijoux anciens, manchette
#
# Points d'attention cannibalisation (cf articles existants) :
# - "sautoir or femme" overlap potentiel avec "collier-longueurs-formes-significations"
#   -> angle a privilegier : choix et port specifique du sautoir (pas forme generale)
# - "bijoux anciens" overlap potentiel avec "bijoux-seconde-main-guide-authentification"
#   -> angle a privilegier : histoire et periodes (Art Deco, Belle Epoque),
#      pas authentification
# - "boucle d'oreille creole" overlap leger avec "boucles-oreilles-modeles-iconiques-joaillerie"
#   -> angle a privilegier : guide d'achat creoles specifique
#
# Notes :
# - La skill /create-article-seo n'est pas encore installee sur ce blog.
#   En attendant, les KW peuvent etre rediges manuellement via /sem-redaction-from-brief
#   ou /sem-redaction-madlords (qui integre la charte editoriale Mad Lords).


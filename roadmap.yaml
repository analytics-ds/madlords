# Roadmap editoriale SEO evergreen — MADLORDS Magazine
#
# Cadence : 1 article SEO / semaine (mardi), du 09/06/2026 au 01/09/2026
# Horizon initial : 13 semaines (juin a debut septembre 2026)
# Execution : automatique via /create-article-auto + cron mardi 3h Paris
# Cumul avec les articles GEO (geo-comparatif) = 2 a 3 publications/semaine,
# cap reseau a 4/semaine respecte.
#
# Volumes verifies via Haloscan (France) le 01/06/2026.
# Volume total cumule : 8 656 recherches/mois sur les 13 KW.
#
# STRATEGIE : mix edito pur + KW hybrides traites avec angle editorial fort.
# Sur la thematique joaillerie en France, les KW edito purs ont des volumes
# faibles. Les KW hybrides (mi-volumiques) avec une SERP mixte permettent au
# blog de se positionner si le contenu est suffisamment fort. Chaque KW est
# associe a un angle editorial clair documente en commentaire.
#
# Repartition par categorie :
#   Bague               : 2 articles
#   Collier             : 2 articles
#   Boucle d'oreille    : 2 articles
#   Bracelet            : 2 articles
#   Bijoux (transverses): 3 articles
#   Seconde main        : 2 articles
#   Total               : 13 articles
#
# Saisonnalite :
#   Juin (sem 1-4)   : pic mariage (alliance, bijoux mariage, collier de mariage, BO mariage)
#   Juillet (sem 5-8): identite et heritage (jonc signification, art deco, creoles histoire, vintage)
#   Aout (sem 9-13)  : rentree et pre-Noel (bague vintage, sautoir, carat or, anciens, manchette)
#
# Points de vigilance cannibalisation :
# - "bijoux mariage" risque de chevaucher les 3 autres KW mariage publies le meme mois
#   -> angle a privilegier : guide transverse "comment composer son look bijoux mariage"
# - "bijoux anciens" overlap potentiel avec "bijoux art deco" et avec l'existant
#   "bijoux-seconde-main-guide-authentification"
#   -> angle a privilegier : panorama des periodes (Art Nouveau, Belle Epoque, etc.)
#      sans focus sur Art Deco ni sur l'authentification
# - "bague vintage" overlap potentiel avec "bijou vintage"
#   -> angle a privilegier : focus bague (formes par siecle, styles emblematiques)
# - "manchette bijou" overlap leger avec l'existant "comment-choisir-bracelet-intemporel"
#   -> angle a privilegier : histoire et art de porter la manchette
#
# Notes :
# - La skill /create-article-seo n'est pas encore installee sur ce blog.
#   En attendant, les KW peuvent etre rediges manuellement via /sem-redaction-from-brief
#   ou /sem-redaction-madlords (qui integre la charte editoriale Mad Lords).


baseURL = "https://mag.madlords.com/"
title = "MADLORDS Magazine"
theme = "mad-lords"

defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
enableEmoji = false

[languages]
  [languages.fr]
    languageCode = "fr-FR"
    languageName = "Francais"
    weight = 1
    title = "MADLORDS Magazine"
    [languages.fr.params]
      description = "Le magazine MADLORDS, dedie a la joaillerie d'exception, a l'art de vivre et aux inspirations qui composent l'univers de la maison."

  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    weight = 2
    title = "MADLORDS Magazine"
    [languages.en.params]
      description = "MADLORDS Magazine, devoted to fine jewelry, the art of living, and the inspirations that shape the world of the home."

[taxonomies]
  category = "categories"
  tag = "tags"

# Menu FR
[[languages.fr.menus.main]]
  name = "Accueil"
  url = "/"
  weight = 1
[[languages.fr.menus.main]]
  name = "Joaillerie"
  url = "/categories/joaillerie/"
  weight = 2
[[languages.fr.menus.main]]
  name = "Maison"
  url = "/categories/maison/"
  weight = 3
[[languages.fr.menus.main]]
  name = "Art de vivre"
  url = "/categories/art-de-vivre/"
  weight = 4
[[languages.fr.menus.main]]
  name = "Inspirations"
  url = "/categories/inspirations/"
  weight = 5
[[languages.fr.menus.main]]
  name = "Le Magazine"
  url = "/blog/"
  weight = 99

# Menu EN
[[languages.en.menus.main]]
  name = "Home"
  url = "/en/"
  weight = 1
[[languages.en.menus.main]]
  name = "Jewelry"
  url = "/en/categories/jewelry/"
  weight = 2
[[languages.en.menus.main]]
  name = "Home & Living"
  url = "/en/categories/home/"
  weight = 3
[[languages.en.menus.main]]
  name = "Lifestyle"
  url = "/en/categories/lifestyle/"
  weight = 4
[[languages.en.menus.main]]
  name = "Inspirations"
  url = "/en/categories/inspirations/"
  weight = 5
[[languages.en.menus.main]]
  name = "The Magazine"
  url = "/en/blog/"
  weight = 99

[params]
  default_og_image = "/images/og-default.jpg"
  logo = "/favicon.svg"
  founding_year = "2026"
  expertise = ["Joaillerie", "Bijoux d'exception", "Art de vivre", "Maison", "Inspirations"]
  primary_color = "#1a1a1a"
  accent_color = "#b8965a"
  background_color = "#ffffff"
  background_alt = "#f7f5f2"
  font_heading = "Playfair Display"
  font_body = "DM Sans"

[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = true
  [markup.goldmark.renderer]
    unsafe = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

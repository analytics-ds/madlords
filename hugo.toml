baseURL = "https://mag.madlords.com/"
title = "MADLORDS Magazine"
theme = "mad-lords"

defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
enableEmoji = false

[languages]
  [languages.fr]
    locale = "fr-FR"
    label = "Francais"
    weight = 1
    contentDir = "content/fr"
    title = "MADLORDS Magazine"
    [languages.fr.params]
      description = "Magazine MADLORDS dédié à celles et ceux que le conformisme horripile. Portraits de créateurs, pièces rares et boutiques discrètes : le luxe hors de ses codes."

  [languages.en]
    locale = "en-US"
    label = "English"
    weight = 2
    contentDir = "content/en"
    title = "MADLORDS Magazine"
    [languages.en.params]
      description = "MADLORDS Magazine, devoted to fine jewelry, the art of living, and the inspirations that shape the world of the home."

[taxonomies]
  category = "categories"
  tag = "tags"

# Mount points multilingues : content/ pour FR, content/en/ pour EN

[params]
  default_og_image = "/images/og-default.jpg"
  logo = "/favicon.svg"
  founding_year = "2026"
  expertise = ["Bracelet", "Bague", "Collier", "Boucle d'oreille", "Seconde main"]
  primary_color = "#1a1a1a"
  accent_color = "#b8965a"
  background_color = "#ffffff"
  background_alt = "#f7f5f2"
  font_heading = "Playfair Display"
  font_body = "DM Sans"

[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.goldmark.renderer]
    unsafe = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"
